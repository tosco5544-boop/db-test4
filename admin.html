<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>全国マーケティング旅 編集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body class="admin">

<div class="admin-bar">
  <div class="inner">
    <div class="admin-row">
      <strong>色の切り替え</strong>
      <span id="who">確認中…</span>
    </div>
    <div class="brushes" id="brushes" role="group" aria-label="塗る色"></div>
    <div class="admin-row">
      <span>色を選んで県をタップすると、すぐLPに反映されます。</span>
      <span class="actions"><a href="/" target="_blank" rel="noopener">トップを見る</a><button type="button" class="btn-ghost" id="logout">ログアウト</button></span>
    </div>
  </div>
</div>

<main class="section">
  <div class="inner" style="display:flex;flex-direction:column;gap:20px">
    <p class="notice" id="notice" hidden></p>

    <div>
      <div class="map-tools">
        <span id="summary">—</span>
        <button type="button" class="btn-ghost" id="zoom">地図を拡大</button>
      </div>
      <div class="map-scroll" id="mapScroll">
        <div class="map-box" id="mapBox"><div class="map-status">地図を読み込んでいます…</div></div>
      </div>
    </div>

    <div>
      <h2 style="font-size:1.2rem;margin-bottom:10px">一覧からも切り替えられます</h2>
      <div class="regions" id="regions"></div>
    </div>
  </div>
</main>

<div class="toast" id="toast" role="status" hidden></div>

<script src="/js/map.js"></script>
<script src="/js/data.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
