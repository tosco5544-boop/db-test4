# 全国マーケティング旅（Cloudflare Workers）
# すべてのファイルを、リポジトリの一番上に並べて置いてください（フォルダは使いません）。

name = "db-test4"          # Cloudflare の Worker の名前
main = "worker.js"
compatibility_date = "2026-10-01"

# 画面ファイル（.html）を Worker に組み込む
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# データベース（D1）
[[d1_databases]]
binding = "DB"                    # コード内で env.DB として使う
database_name = "my-auth-db"
database_id = "374f7acc-c47c-446f-bf71-8a9d7ddeb0dc"  # D1 の画面に出ている ID

# ログイン用の秘密の文字列 JWT_SECRET は、ここには書きません。
# ダッシュボードの Worker →「設定」→「変数とシークレット」で「シークレット」として追加します。
