<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ログイン｜全国マーケティング旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="inner">
  <form class="login" id="form" novalidate>
    <h1>編集ページにログイン</h1>
    <p class="msg">地図の色を変えられるのは、登録されたユーザーだけです。</p>
    <label for="username">ユーザー名</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">パスワード</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" type="submit" id="submit">ログイン</button>
    <a class="msg" href="/">トップへ戻る</a>
  </form>
</main>
<script src="/js/login.js"></script>
</body>
</html>
