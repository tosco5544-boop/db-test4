<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>全国マーケティング旅</title>
<meta name="description" content="マーケティングの仕事で全国47都道府県をめぐる旅の記録です。赤は訪れた県、青は次に向かう県です。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-head">
  <div class="inner">
    <a class="logo" href="./">MARKETING JOURNEY</a>
    <nav><a href="#map">地図</a><a href="#list">一覧</a></nav>
  </div>
</header>

<main>
  <section class="hero">
    <div class="inner">
      <div>
        <p class="eyebrow">47 PREFECTURES</p>
        <h1>全国マーケティング旅</h1>
        <p class="lead">マーケティングの仕事で全国47都道府県をめぐる旅の記録です。赤は訪れた県、青は次に向かう県です。</p>
        <p class="next-line" id="nextLine" hidden></p>
      </div>
      <div class="tally" aria-live="polite">
        <span class="big" id="count">0</span><span class="of"> / 47</span>
        <div id="rate">達成率 0%</div>
      </div>
      <div class="progress" aria-hidden="true"><span id="bar"></span></div>
    </div>
  </section>

  <section class="section" id="map">
    <div class="inner">
      <h2>都道府県マップ</h2>
      <p class="note" id="updated">最終更新：—</p>
      <div class="map-tools">
        <div class="legend" id="legend"><span><i></i>読み込み中</span></div>
        <button type="button" class="btn-ghost" id="zoom">地図を拡大</button>
      </div>
      <div class="map-scroll" id="mapScroll">
        <div class="map-box" id="mapBox"><div class="map-status">地図を読み込んでいます…</div></div>
      </div>
      <p class="lead lead-sp">マーケティングの仕事で全国47都道府県をめぐる旅の記録です。赤は訪れた県、青は次に向かう県です。</p>
    </div>
  </section>

  <section class="section" id="list">
    <div class="inner">
      <h2>地方別一覧</h2>
      <p class="note">地方ごとの達成状況です。</p>
      <div class="regions" id="regions"></div>
    </div>
  </section>
</main>

<footer class="site-foot">
  <div class="inner">
    <span>© 全国マーケティング旅</span>
    <span>地図データ：amCharts</span>
  </div>
</footer>

<script src="js/map.js"></script>
<script src="js/data.js"></script>
<script src="js/lp.js"></script>
</body>
</html>
