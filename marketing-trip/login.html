<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ログイン｜全国マーケティング旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<!--STYLE-->
</head>
<body>
<main class="inner">
  <form class="login" id="form" novalidate>
    <h1>編集ページにログイン</h1>
    <p class="msg">地図の色を変えられるのは、登録されたユーザーだけです。</p>
    <label for="username">ユーザー名</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">パスワード</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" type="submit" id="submit">ログイン</button>
    <a class="msg" href="/">トップへ戻る</a>
  </form>
</main>
<script>
/* ログイン画面：ユーザー名とパスワードを /api/login に送り、成功したら編集画面へ移動します。
 * ログイン状態はサーバーが HttpOnly クッキーで管理するので、ブラウザ側で保存するものはありません。 */
(function () {
  var form = document.getElementById("form"), err = document.getElementById("err"), btn = document.getElementById("submit");

  // すでにログインしていれば編集画面へ
  fetch("/api/me", { cache: "no-store", credentials: "same-origin" }).then(function (r) {
    if (r.ok) location.replace("/admin");
  }).catch(function () {});

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    var username = document.getElementById("username").value.trim();
    var password = document.getElementById("password").value;
    if (!username || !password) { err.textContent = "ユーザー名とパスワードを入力してください。"; return; }
    err.textContent = ""; btn.disabled = true; btn.textContent = "確認中…";
    try {
      var r = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ username: username, password: password })
      });
      var j = await r.json().catch(function () { return {}; });
      if (!r.ok) throw new Error(j.error || "ログインできませんでした（" + r.status + "）");
      location.replace("/admin");
    } catch (ex) {
      err.textContent = ex.message + "。";
      btn.disabled = false; btn.textContent = "ログイン";
    }
  });
})();
</script>
</body>
</html>
